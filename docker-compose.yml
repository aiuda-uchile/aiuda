services:
  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: aiuda-backend
    dns:
      - 8.8.8.8
      - 8.8.4.4
    user: "root"
    working_dir: /workspace
    command: micromamba run -n aiuda-whisper uvicorn src.backend.aiuda_backend_fastapi:app --host 0.0.0.0 --port 8010 --reload
    volumes:
      - ./:/workspace
    environment:
      - PYTHONUNBUFFERED=1
      - AIUDA_SMTP_HOST=${AIUDA_SMTP_HOST:-}
      - AIUDA_SMTP_PORT=${AIUDA_SMTP_PORT:-587}
      - AIUDA_SMTP_USER=${AIUDA_SMTP_USER:-}
      - AIUDA_SMTP_PASSWORD=${AIUDA_SMTP_PASSWORD:-}
      - AIUDA_SMTP_FROM=${AIUDA_SMTP_FROM:-}
      - AIUDA_SMTP_SECURITY=${AIUDA_SMTP_SECURITY:-tls}
      - AIUDA_MAX_EMAIL_ATTACH_MB=${AIUDA_MAX_EMAIL_ATTACH_MB:-20}

  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: aiuda-frontend
    working_dir: /workspace/src/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8010
    volumes:
      - ./src/frontend:/workspace/src/frontend
      - /workspace/src/frontend/node_modules
    depends_on:
      - backend

  proxy:
    image: jc21/nginx-proxy-manager:latest
    container_name: aiuda-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - ./docker/npm/data:/data
      - ./docker/npm/letsencrypt:/etc/letsencrypt
    depends_on:
      - frontend